name: Build VolumeHUD iOS 27

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'app/src/**'
      - '.github/workflows/build-volumehud.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: .
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK, Xposed metadata, and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          unzip -p "$APK" assets/xposed_init > /tmp/xposed_init.txt
          grep -Fx 'id.volumehud.ios27.VolumeHudEntry' /tmp/xposed_init.txt
          grep -Fx 'id.volumehud.ios27.SystemServerKeyHook' /tmp/xposed_init.txt
          if unzip -l "$APK" | grep -q 'de/robv/android/xposed/'; then
            echo "ERROR: Xposed API classes must not be packaged (compileOnly expected)."
            exit 1
          fi
          aapt dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'xposedmodule' /tmp/manifest.txt
          grep -q 'xposedminversion' /tmp/manifest.txt
          sha256sum "$APK" | tee SHA256SUMS.txt
          cp "$APK" VolumeHUD-iOS27-debug.apk

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: VolumeHUD-iOS27-0.1.6-dev
          path: |
            VolumeHUD-iOS27-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
